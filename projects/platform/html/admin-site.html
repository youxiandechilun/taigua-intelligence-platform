<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>独立站入口 - 泰卦智能管理后台</title>
<link rel="icon" href="../icons/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="../icons/favicon-32.png" />
<link rel="stylesheet" href="common.css" />
<link rel="stylesheet" href="common-admin.css" />
<style>
.site-grid{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
@media(max-width:980px){.site-grid{grid-template-columns:1fr}}
.sw-row{display:flex;align-items:center;gap:10px;padding:10px 0}
.sw-row .t{font-size:13.5px}
.sw-row .d{font-size:12px;color:var(--muted)}
.sw{position:relative;width:44px;height:24px;flex:0 0 auto;cursor:pointer}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;border-radius:999px;background:var(--border-strong);transition:.2s}
.sw i::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}
.sw input:checked + i{background:var(--accent)}
.sw input:checked + i::after{transform:translateX(20px)}
.pv-side{border:1px solid var(--border);border-radius:12px;padding:10px;background:var(--bg)}
.pv-side .it{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;font-size:13px;color:var(--muted)}
.pv-side .it.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.pv-side .it .ext{margin-left:auto;font-size:10.5px;color:var(--muted-2);border:1px solid var(--border);border-radius:5px;padding:0 4px}
.pv-card{margin-top:12px;border:1px solid var(--border);border-radius:14px;padding:16px 14px;
  background:linear-gradient(120deg,var(--accent-soft),var(--bg-soft) 62%)}
.pv-card h4{margin:0 0 4px;font-size:13.5px}
.pv-card p{margin:0;font-size:12px;color:var(--muted);line-height:1.6}
.pv-card .b{margin-top:10px;display:inline-block;padding:6px 12px;border-radius:8px;
  background:var(--accent);color:#fff;font-size:12px}
</style>
</head>
<body>
<div class="adm">
  <div id="adm-side-root"></div>
  <div class="adm-main">
    <div id="adm-top-root"></div>
    <div class="adm-body">

      <div class="adm-head">
        <div>
          <h1>独立站入口</h1>
          <p>商家端「智能体管理」下方展示的「独立站创建」入口，点击跳转到指定地址；保存后立即生效</p>
        </div>
        <div class="right">
          <button class="btn btn-sm" onclick="load()">刷新</button>
          <button class="btn btn-primary btn-sm" onclick="save()">保存设置</button>
        </div>
      </div>

      <div class="site-grid">
        <div class="panel">
          <div class="panel-h"><b>入口配置</b><span class="sub" id="state-badge"></span></div>

          <div class="sw-row">
            <label class="sw"><input type="checkbox" id="s-enabled" /><i></i></label>
            <div>
              <div class="t">在商家端显示该入口</div>
              <div class="d">关闭后商家侧栏与智能体管理页都不再出现「独立站创建」</div>
            </div>
          </div>

          <div class="divider"></div>

          <div class="field"><label>菜单名称 <em>*</em></label>
            <input id="s-name" maxlength="20" placeholder="独立站创建" />
            <div class="hint">显示在商家端侧栏与入口卡片标题上，建议 4–8 个字</div>
          </div>

          <div class="field"><label>跳转地址 <em>*</em></label>
            <input id="s-url" placeholder="https://dlz.taikua.cn" />
            <div class="hint">不写协议时自动补 https://，例如 dlz.taikua.cn → https://dlz.taikua.cn</div>
          </div>

          <div class="field"><label>入口说明</label>
            <input id="s-desc" maxlength="80" placeholder="一键生成属于您品牌的企业独立站" />
            <div class="hint">展示在智能体管理页的入口卡片上，可留空</div>
          </div>

          <div class="sw-row">
            <label class="sw"><input type="checkbox" id="s-newtab" /><i></i></label>
            <div>
              <div class="t">在新标签页打开</div>
              <div class="d">建议开启，避免商家离开当前控制台</div>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-h"><b>商家端效果预览</b></div>
          <div class="pv-side" id="pv-side"></div>
          <div class="pv-card" id="pv-card"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="common-admin.js"></script>
<script>
const $ = id => document.getElementById(id);

(async () => {
  const me = await admInit('admin-site.html');
  if (!me) return;
  await load();
  ['s-enabled', 's-newtab', 's-name', 's-url', 's-desc'].forEach(id =>
    $(id).addEventListener('input', renderPreview));
  $('s-enabled').addEventListener('change', renderPreview);
  $('s-newtab').addEventListener('change', renderPreview);
})();

async function load() {
  const j = await api('/api/site-entries');
  if (j && j.code === 0) {
    const e = j.data.standalone;
    $('s-enabled').checked = !!Number(e.enabled);
    $('s-newtab').checked = !!Number(e.new_tab);
    $('s-name').value = e.name || '';
    $('s-url').value = e.url || '';
    $('s-desc').value = e.desc || '';
    renderPreview();
  } else {
    // 兜底：管理员也可读管理接口
    const j2 = await api('/api/admin/site-entries');
    if (j2.code !== 0) return toast(j2.msg || '加载失败');
    const e = j2.data.standalone;
    $('s-enabled').checked = !!Number(e.enabled);
    $('s-newtab').checked = !!Number(e.new_tab);
    $('s-name').value = e.name || '';
    $('s-url').value = e.url || '';
    $('s-desc').value = e.desc || '';
    renderPreview();
  }
}

function renderPreview() {
  const on = $('s-enabled').checked;
  const name = $('s-name').value.trim() || '独立站创建';
  const url = $('s-url').value.trim();
  const desc = $('s-desc').value.trim() || '一键生成属于您品牌的企业独立站';
  const badge = $('state-badge');
  badge.className = on ? 'badge green' : 'badge';
  badge.textContent = on ? '已启用' : '已隐藏';

  const items = [
    ['商家信息', false], ['智能体管理', true], ['__SITE__', false],
    ['TOKEN 充值', false], ['客服中心', false], ['关于泰卦', false],
  ];
  $('pv-side').innerHTML = items.map(([t, act]) => {
    if (t === '__SITE__') {
      if (!on) return '';
      return `<div class="it on">${esc(name)}<span class="ext">↗</span></div>`;
    }
    return `<div class="it${act ? '' : ''}">${esc(t)}</div>`;
  }).join('');
  $('pv-card').innerHTML = on
    ? `<h4>${esc(name)}</h4><p>${esc(desc)}</p><span class="b">立即前往 →</span>
       <div class="small muted mono" style="margin-top:8px;word-break:break-all">${esc(url || '（未填写地址）')}</div>`
    : '<div class="small muted">入口已隐藏，商家端不显示该卡片</div>';
}

async function save() {
  const name = $('s-name').value.trim();
  const url = $('s-url').value.trim();
  if (!name) return toast('菜单名称不能为空');
  if (!url) return toast('请填写跳转地址');
  const payload = {
    enabled: $('s-enabled').checked ? 1 : 0,
    new_tab: $('s-newtab').checked ? 1 : 0,
    name, url, desc: $('s-desc').value.trim(),
  };
  const j = await api('/api/admin/site-entries', 'PUT', payload);
  if (j.code === 0) {
    const e = j.data.standalone;
    $('s-name').value = e.name;
    $('s-url').value = e.url;
    renderPreview();
    toast('已保存，商家端即时生效');
  } else toast(j.msg || '保存失败');
}
</script>
</body>
</html>
