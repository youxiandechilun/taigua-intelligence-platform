<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>点数与流水 - 泰卦智能管理后台</title>
<link rel="icon" href="../icons/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="../icons/favicon-32.png" />
<link rel="stylesheet" href="common.css" />
<link rel="stylesheet" href="common-admin.css" />
</head>
<body>
<div class="adm">
  <div id="adm-side-root"></div>
  <div class="adm-main">
    <div id="adm-top-root"></div>
    <div class="adm-body">

      <div class="adm-head">
        <div>
          <h1>点数与流水</h1>
          <p>查看全平台点数收支明细，手动为商家充值或扣减点数</p>
        </div>
        <div class="right">
          <button class="btn btn-sm" onclick="download('transactions')">导出流水</button>
          <button class="btn btn-primary btn-sm" onclick="openAdjust()">＋ 手动调整点数</button>
        </div>
      </div>

      <div class="mini-row">
        <div class="mini"><div class="l">全平台点数总量</div><div class="n" id="m-balance">—</div></div>
        <div class="mini"><div class="l">筛选范围内发放（+）</div><div class="n" id="m-in" style="color:var(--ok)">—</div></div>
        <div class="mini"><div class="l">筛选范围内消耗（−）</div><div class="n" id="m-out" style="color:var(--accent)">—</div></div>
      </div>

      <div class="toolbar">
        <div class="grow">
          <select class="sel" id="m-sel" style="width:100%"><option value="">全部商家</option></select>
        </div>
        <select class="sel" id="type-sel">
          <option value="">全部类型</option>
          <option value="recharge">充值 / 发放</option>
          <option value="consume">消耗 / 扣减</option>
        </select>
        <button class="btn" onclick="setPage(1)">查询</button>
        <button class="btn" onclick="resetFilter()">重置</button>
      </div>

      <div class="adm-table">
        <table>
          <thead><tr>
            <th style="width:66px">流水号</th><th>商家</th><th>类型</th><th>点数变动</th><th>备注</th><th>时间</th><th style="width:110px">操作</th>
          </tr></thead>
          <tbody id="rows"><tr><td colspan="7" class="empty">加载中…</td></tr></tbody>
        </table>
      </div>
      <div id="pager"></div>

    </div>
  </div>
</div>

<script src="common-admin.js"></script>
<script>
const S = { page: 1, pageSize: 15, merchant: '', type: '', total: 0 };
let MERCHANTS = [];
const $ = id => document.getElementById(id);

(async () => {
  const me = await admInit('admin-points.html');
  if (!me) return;
  const q = new URLSearchParams(location.search);
  if (q.get('merchant_id')) S.merchant = q.get('merchant_id');
  await loadMerchants();
  await loadStats();
  load();
})();

async function loadStats() {
  const j = await api('/api/admin/stats');
  if (j.code === 0) $('m-balance').textContent = num(j.data.tokens);
}

async function loadMerchants() {
  const j = await api('/api/admin/merchants?pageSize=100');
  if (j.code !== 0) return;
  MERCHANTS = j.data.list;
  $('m-sel').innerHTML = '<option value="">全部商家</option>' +
    MERCHANTS.map(m => `<option value="${m.id}">${esc(m.company)}（${num(m.token_balance)} 点）</option>`).join('');
  if (S.merchant) $('m-sel').value = S.merchant;
}

function resetFilter() {
  S.merchant = ''; S.type = '';
  $('m-sel').value = ''; $('type-sel').value = '';
  setPage(1);
}

function setPage(p) {
  S.page = p;
  S.merchant = $('m-sel').value;
  S.type = $('type-sel').value;
  load();
}

async function load() {
  const qs = new URLSearchParams({ page: S.page, pageSize: S.pageSize });
  if (S.merchant) qs.set('merchant_id', S.merchant);
  if (S.type) qs.set('type', S.type);
  const j = await api('/api/admin/transactions?' + qs.toString());
  if (j.code !== 0) return toast(j.msg || '加载失败');
  const d = j.data;
  S.total = d.total;
  $('m-in').textContent = num(d.income);
  $('m-out').textContent = num(d.outcome);

  const body = $('rows');
  if (!d.list.length) { body.innerHTML = '<tr><td colspan="7" class="empty">暂无流水记录</td></tr>'; }
  else body.innerHTML = d.list.map(t => `
    <tr>
      <td class="mono small">#${t.id}</td>
      <td><b>${esc(t.company || '已删除商家')}</b></td>
      <td>${t.type === 'recharge' ? '<span class="badge green">充值/发放</span>' : '<span class="badge red">消耗/扣减</span>'}</td>
      <td class="mono" style="color:${t.points > 0 ? 'var(--ok)' : 'var(--accent)'};font-weight:600">${t.points > 0 ? '+' : ''}${num(t.points)}</td>
      <td class="small">${esc(t.note || '—')}</td>
      <td class="mono small">${fmtTime(t.created_at)}</td>
      <td><button class="btn btn-sm" onclick="openAdjust(${t.merchant_id})">再调整</button></td>
    </tr>`).join('');
  renderPager($('pager'), S.total, S.page, S.pageSize, setPage);
  loadBadges();
}

/* ---------- 手动调整 ---------- */
function openAdjust(merchantId) {
  const opts = MERCHANTS.map(m =>
    `<option value="${m.id}" ${String(merchantId || S.merchant) === String(m.id) ? 'selected' : ''}>${esc(m.company)}（${num(m.token_balance)} 点）</option>`).join('');
  openModal(`<h3>手动调整点数</h3>
    <div class="field"><label>选择商家 <em>*</em></label><select id="ad-merchant">${opts}</select></div>
    <div class="form-row">
      <div class="field"><label>调整数量 <em>*</em></label><input id="ad-points" type="number" placeholder="正数增加，负数扣减" /></div>
      <div class="field"><label>快捷金额</label>
        <select id="ad-quick" onchange="quickFill(this.value)">
          <option value="">自定义</option>
          <option value="1000">+1,000</option><option value="5000">+5,000</option>
          <option value="10000">+10,000</option><option value="-1000">−1,000</option>
        </select>
      </div>
    </div>
    <div class="field"><label>备注</label><input id="ad-note" placeholder="如：线下汇款充值 ￥500 / 违规扣减" /></div>
    <div class="hint">扣减后余额不能为负数；每次调整都会生成一条流水记录。</div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="doAdjust()">确认调整</button>
    </div>`);
}
function quickFill(v) { if (v) $('ad-points').value = v; }

async function doAdjust() {
  const mid = $('ad-merchant').value;
  const points = parseInt($('ad-points').value || '0', 10);
  if (!mid) return toast('请选择商家');
  if (!points) return toast('请输入非 0 的调整数量');
  const j = await api(`/api/admin/merchants/${mid}/points`, 'POST',
    { points, note: $('ad-note').value.trim() });
  if (j.code === 0) {
    toast(j.msg); closeModal();
    await loadMerchants(); await loadStats(); await load();
  } else toast(j.msg || '调整失败');
}
</script>
</body>
</html>
