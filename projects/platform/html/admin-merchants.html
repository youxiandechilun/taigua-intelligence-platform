<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>商家管理 - 泰卦智能管理后台</title>
<link rel="icon" href="../icons/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="../icons/favicon-32.png" />
<link rel="stylesheet" href="common.css" />
<link rel="stylesheet" href="common-admin.css" />
</head>
<body>
<div class="adm">
  <div id="adm-side-root"></div>
  <div class="adm-main">
    <div id="adm-top-root"></div>
    <div class="adm-body">

      <div class="adm-head">
        <div>
          <h1>商家管理</h1>
          <p>开通 / 审核 / 编辑 / 停用商家账号，管理点数与登录密码</p>
        </div>
        <div class="right">
          <button class="btn btn-sm" onclick="download('merchants')">导出 CSV</button>
          <button class="btn btn-primary btn-sm" onclick="openCreate()">＋ 开通商家</button>
        </div>
      </div>

      <div class="tabs" id="tabs"></div>

      <div class="toolbar">
        <div class="grow">
          <input class="inp" id="kw" placeholder="搜索企业名称 / 联系人 / 手机号 / 邮箱，回车查询" />
        </div>
        <select class="sel" id="status-sel">
          <option value="">全部状态</option>
          <option>待审核</option><option>已认证</option><option>已驳回</option><option>已过期</option>
        </select>
        <button class="btn" onclick="setPage(1)">查询</button>
        <button class="btn" onclick="resetFilter()">重置</button>
      </div>

      <div class="adm-table">
        <table>
          <thead>
            <tr>
              <th style="width:46px">ID</th><th>企业名称</th><th>联系人</th><th>手机号</th>
              <th>行业</th><th>点数</th><th>状态</th><th>注册时间</th><th style="width:150px">操作</th>
            </tr>
          </thead>
          <tbody id="rows"><tr><td colspan="9" class="empty">加载中…</td></tr></tbody>
        </table>
      </div>
      <div id="pager"></div>

    </div>
  </div>
</div>

<script src="common-admin.js"></script>
<script>
const S = { page: 1, pageSize: 10, keyword: '', status: '', total: 0, list: [] };
const $ = id => document.getElementById(id);

(async () => {
  const me = await admInit('admin-merchants.html');
  if (!me) return;
  const q = new URLSearchParams(location.search);
  if (q.get('status')) S.status = q.get('status');
  $('status-sel').value = S.status;
  $('kw').addEventListener('keydown', e => { if (e.key === 'Enter') setPage(1); });
  renderTabs();
  load();
})();

function renderTabs() {
  const tabs = [['', '全部'], ['待审核', '待审核'], ['已认证', '已认证'], ['已驳回', '已驳回'], ['已过期', '已过期']];
  $('tabs').innerHTML = tabs.map(([v, l]) =>
    `<a class="${S.status === v ? 'on' : ''}" onclick="tabTo('${v}')">${l}</a>`).join('');
}
function tabTo(v) {
  S.status = v; $('status-sel').value = v; renderTabs(); setPage(1);
}
function resetFilter() {
  S.keyword = ''; S.status = ''; $('kw').value = ''; $('status-sel').value = '';
  renderTabs(); setPage(1);
}
function setPage(p) {
  S.page = p;
  S.keyword = $('kw').value.trim();
  S.status = $('status-sel').value;
  renderTabs();
  load();
}

async function load() {
  const qs = new URLSearchParams({ page: S.page, pageSize: S.pageSize });
  if (S.keyword) qs.set('keyword', S.keyword);
  if (S.status) qs.set('status', S.status);
  const j = await api('/api/admin/merchants?' + qs.toString());
  if (j.code !== 0) { toast(j.msg || '加载失败'); return; }
  S.list = j.data.list; S.total = j.data.total;
  renderRows();
  renderPager($('pager'), S.total, S.page, S.pageSize, setPage);
}

function renderRows() {
  const body = $('rows');
  if (!S.list.length) {
    body.innerHTML = '<tr><td colspan="9" class="empty">没有符合条件的商家</td></tr>';
    return;
  }
  body.innerHTML = S.list.map(m => `
    <tr>
      <td class="mono small">${m.id}</td>
      <td><b>${esc(m.company)}</b>${m.disabled ? ' <span class="badge red">已停用</span>' : ''}</td>
      <td>${esc(m.contact || '—')}</td>
      <td class="mono small">${esc(m.phone)}</td>
      <td class="small">${esc(m.industry || '—')}</td>
      <td class="mono">${num(m.token_balance)}</td>
      <td>${statusBadge(m.status)}</td>
      <td class="mono small">${fmtTime(m.created_at)}</td>
      <td>
        <div class="op">
          <button class="btn" onclick="openDetail(${m.id})">详情</button>
          ${m.status === '待审核' ? `<button class="btn btn-primary" onclick="openDetail(${m.id})">审核</button>` : ''}
        </div>
      </td>
    </tr>`).join('');
}

/* ---------- 详情抽屉 ---------- */
let CUR = null;
async function openDetail(id) {
  const j = await api('/api/admin/merchants/' + id);
  if (j.code !== 0) return toast(j.msg || '加载失败');
  CUR = j.data;
  const m = CUR;
  const recent = (m.recent_tx || []).map(t => `
    <div class="list-row">
      <div class="grow"><b>${t.points > 0 ? '+' : ''}${t.points} 点</b><span>${esc(t.note || '—')} · ${fmtTime(t.created_at)}</span></div>
      <span class="badge ${t.points > 0 ? 'green' : ''}">${t.type === 'recharge' ? '充值' : '消耗'}</span>
    </div>`).join('') || '<div class="small muted">暂无流水</div>';

  openDrawer(m.status === '待审核' ? '商家审核 · ' + m.company : '商家详情 · ' + m.company, `
    <div class="dl" style="margin-bottom:16px">
      <dt>商家 ID</dt><dd class="mono">${m.id}</dd>
      <dt>手机号</dt><dd class="mono">${esc(m.phone)}</dd>
      <dt>点数余额</dt><dd class="mono"><b>${num(m.token_balance)}</b> 点</dd>
      <dt>认证状态</dt><dd>${statusBadge(m.status)} ${m.disabled ? '<span class="badge red">已停用</span>' : ''}</dd>
      <dt>注册时间</dt><dd>${fmtTime(m.created_at)}</dd>
      <dt>最近登录</dt><dd>${fmtTime(m.last_login)}</dd>
      <dt>流水 / 工单</dt><dd>${m.tx_count} 笔 / ${m.ticket_count} 单</dd>
    </div>

    <div class="divider"></div>
    <div class="small" style="font-weight:600;margin-bottom:12px">申请资料</div>
    <div class="dl" style="margin-bottom:16px">
      <dt>企业名称</dt><dd>${esc(m.company || '—')}</dd>
      ${m.contact ? `<dt>主联系人</dt><dd>${esc(m.contact)}</dd>` : ''}
      <dt>登录手机号</dt><dd class="mono">${esc(m.phone)}</dd>
      ${m.apply_remark ? `<dt>需求说明</dt><dd style="white-space:pre-wrap">${esc(m.apply_remark)}</dd>` : ''}
      ${m.invited_by ? `<dt>注册邀请码</dt><dd class="mono">${esc(m.invited_by)}</dd>` : ''}
      ${!m.contact && !m.apply_remark && !m.invited_by ? '<dt></dt><dd class="small muted">注册时仅填写了企业名称与手机号</dd>' : ''}
    </div>

    <div class="divider"></div>
    <div class="small" style="font-weight:600;margin-bottom:12px">编辑资料</div>
    <div class="field"><label>企业名称 <em>*</em></label><input id="e-company" value="${esc(m.company)}" /></div>
    <div class="form-row">
      <div class="field"><label>联系人</label><input id="e-contact" value="${esc(m.contact)}" /></div>
      <div class="field"><label>邮箱</label><input id="e-email" value="${esc(m.email)}" /></div>
    </div>
    <div class="form-row">
      <div class="field"><label>行业</label><input id="e-industry" value="${esc(m.industry)}" /></div>
      <div class="field"><label>规模</label>
        <select id="e-scale">
          ${['', '1-19', '20-49', '50-199', '200+'].map(s => `<option ${m.scale === s ? 'selected' : ''}>${s}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="field"><label>省份</label><input id="e-province" value="${esc(m.province)}" /></div>
      <div class="field"><label>城市</label><input id="e-city" value="${esc(m.city)}" /></div>
    </div>
    <div class="field"><label>官网</label><input id="e-website" value="${esc(m.website)}" /></div>
    <div class="field"><label>认证状态</label>
      <select id="e-status">
        ${['待审核', '已认证', '已驳回', '已过期'].map(s => `<option ${m.status === s ? 'selected' : ''}>${s}</option>`).join('')}
      </select>
    </div>
    <div class="field"><label>平台备注</label><textarea id="e-remark" placeholder="仅内部可见">${esc(m.remark || '')}</textarea></div>

    <div class="divider"></div>
    <div class="small" style="font-weight:600;margin-bottom:10px">账号操作</div>
    <div class="op" style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-sm" onclick="adjustPoints()">调整点数</button>
      <button class="btn btn-sm" onclick="resetPwd()">重置密码</button>
      <button class="btn btn-sm" onclick="toggleDisable()">${m.disabled ? '启用账号' : '停用账号'}</button>
      <button class="btn btn-sm btn-danger" onclick="delMerchant()">删除商家</button>
    </div>

    <div class="divider"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div class="small" style="font-weight:600">智能体授权</div>
      <a class="small" href="/ht/admin-agents" target="_blank" style="color:var(--accent);text-decoration:none">去管理智能体 →</a>
    </div>
    <div id="m-agents"><div class="small muted">加载中…</div></div>

    <div class="divider"></div>
    <div class="small" style="font-weight:600;margin-bottom:8px">最近流水</div>
    ${recent}
  `, `
    <button class="btn" onclick="closeDrawer()">取消</button>
    ${m.status === '待审核' ? `<button class="btn btn-danger" onclick="quickReview('已驳回')">驳回</button>
    <button class="btn btn-primary" onclick="quickReview('已认证')">通过认证</button>` : `<button class="btn btn-primary" onclick="saveDetail()">保存资料</button>`}
  `);
  loadMerchantAgents();
}

/* ---------- 智能体授权（单个商家） ---------- */
let M_AGENTS = [];

async function loadMerchantAgents() {
  const box = $('m-agents');
  if (!box || !CUR) return;
  const j = await api('/api/admin/merchants/' + CUR.id + '/agents');
  if (j.code !== 0) { box.innerHTML = '<div class="small muted">加载失败</div>'; return; }
  M_AGENTS = j.data.list || [];
  if (!M_AGENTS.length) {
    box.innerHTML = '<div class="small muted">暂无智能体，请先在「智能体管理」中创建</div>';
    return;
  }
  box.innerHTML = M_AGENTS.map(a => {
    const badge = a.active ? '<span class="badge green">已开通</span>'
      : a.expired ? '<span class="badge red">已过期</span>' : '<span class="badge">未开通</span>';
    const exp = a.expire_at
      ? `<span class="mono" style="font-size:11px;color:var(--muted-2)">至 ${esc((a.expire_at || '').slice(0, 10))}</span>`
      : '';
    const price = Number(a.price) > 0
      ? `￥${Number(a.price)} / ${a.duration_days || 365} 天`
      : '未定价';
    return `<div class="list-row" style="align-items:center;gap:8px">
      <div class="grow"><b>${esc(a.name)}</b><span>${esc(a.tag_name)} · ${price} ${exp}</span></div>
      ${badge}
      <button class="btn btn-sm" onclick="grantFor(${a.id})">${a.active ? '续期' : '开通'}</button>
      ${a.expire_at ? `<button class="btn btn-sm btn-danger" onclick="revokeAgent(${a.id})">取消</button>` : ''}
    </div>`;
  }).join('');
}

function grantFor(agentId) {
  const a = M_AGENTS.find(x => x.id === agentId);
  if (!a) return toast('智能体不存在');
  openModal(`<h3>${a.active ? '续期' : '开通'}智能体</h3>
    <p class="small muted" style="margin-bottom:14px">商家：${esc(CUR.company)} ｜ 智能体：${esc(a.name)}${a.active ? '<br>当前到期：' + esc((a.expire_at || '').slice(0, 10)) + '（续期自动顺延）' : ''}</p>
    <div class="field"><label>有效期（天）</label><input id="mg-days" type="number" min="1" value="${a.duration_days || 365}" /></div>
    <p class="small muted">管理员开通不扣商家点数，仅记录一条「管理员开通」购买记录。</p>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="doGrantFor(${a.id})">确认${a.active ? '续期' : '开通'}</button>
    </div>`);
}

async function doGrantFor(agentId) {
  const days = parseInt($('mg-days').value || '0', 10);
  if (!days || days <= 0) return toast('有效期必须大于 0 天');
  const j = await api('/api/admin/agent-grant', 'POST',
    { merchant_id: CUR.id, agent_id: agentId, days });
  if (j.code === 0) { closeModal(); toast(j.msg || '已开通'); await loadMerchantAgents(); }
  else toast(j.msg || '操作失败');
}

async function revokeAgent(agentId) {
  const a = M_AGENTS.find(x => x.id === agentId);
  if (!a) return;
  if (!confirm(`取消「${CUR.company}」对「${a.name}」的授权？取消后该商家立即无法使用此智能体。`)) return;
  const j = await api('/api/admin/agent-revoke', 'POST', { merchant_id: CUR.id, agent_id: agentId });
  if (j.code === 0) { toast('已取消授权'); await loadMerchantAgents(); }
  else toast(j.msg || '操作失败');
}

function body(id) { return $(id).value.trim(); }

async function saveDetail() {
  const data = {
    company: body('e-company'), contact: body('e-contact'), email: body('e-email'),
    industry: body('e-industry'), scale: body('e-scale'), province: body('e-province'),
    city: body('e-city'), website: body('e-website'), status: body('e-status'),
    remark: body('e-remark'),
  };
  if (!data.company) return toast('企业名称不能为空');
  const j = await api('/api/admin/merchants/' + CUR.id, 'PUT', data);
  if (j.code === 0) { toast('资料已保存'); closeDrawer(); load(); loadBadges(); }
  else toast(j.msg || '保存失败');
}

async function quickReview(status) {
  const j = await api(`/api/admin/merchants/${CUR.id}/review`, 'POST', { status });
  if (j.code === 0) { toast('审核结果：' + status); closeDrawer(); load(); loadBadges(); }
  else toast(j.msg || '操作失败');
}

function adjustPoints() {
  openModal(`<h3>调整点数</h3>
    <p class="small muted" style="margin-bottom:14px">${esc(CUR.company)} · 当前余额 ${num(CUR.token_balance)} 点</p>
    <div class="field"><label>调整数量（正数增加，负数扣减）</label>
      <input id="p-points" type="number" placeholder="例如 5000 或 -500" /></div>
    <div class="field"><label>备注</label><input id="p-note" placeholder="如：线下汇款充值 / 违规扣减" /></div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="doPoints()">确认调整</button>
    </div>`);
}
async function doPoints() {
  const points = parseInt($('p-points').value || '0', 10);
  if (!points) return toast('请输入非 0 的调整数量');
  const j = await api(`/api/admin/merchants/${CUR.id}/points`, 'POST',
    { points, note: $('p-note').value.trim() });
  if (j.code === 0) {
    toast(j.msg); closeModal(); CUR.token_balance = j.data.balance;
    openDetail(CUR.id); load();
  } else toast(j.msg || '调整失败');
}

function resetPwd() {
  openModal(`<h3>重置登录密码</h3>
    <p class="small muted" style="margin-bottom:14px">${esc(CUR.company)}（${esc(CUR.phone)}）</p>
    <div class="field"><label>新密码</label><input id="p-pwd" placeholder="至少 6 位" /></div>
    <div class="hint">重置后该商家的所有登录会话会失效，需要用新密码重新登录。</div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="doResetPwd()">确认重置</button>
    </div>`);
}
async function doResetPwd() {
  const password = $('p-pwd').value.trim();
  if (password.length < 6) return toast('密码至少 6 位');
  const j = await api(`/api/admin/merchants/${CUR.id}/reset-password`, 'POST', { password });
  if (j.code === 0) { toast(j.msg); closeModal(); }
  else toast(j.msg || '重置失败');
}

async function toggleDisable() {
  const act = CUR.disabled ? '启用' : '停用';
  if (!confirm(`确定${act}「${CUR.company}」？${CUR.disabled ? '' : '停用后该商家将无法登录。'}`)) return;
  const j = await api(`/api/admin/merchants/${CUR.id}/toggle`, 'POST');
  if (j.code === 0) { toast(j.msg); closeDrawer(); load(); loadBadges(); }
  else toast(j.msg || '操作失败');
}

async function delMerchant() {
  if (!confirm(`删除「${CUR.company}」将同时删除其流水与工单，且不可恢复。确定继续？`)) return;
  const j = await api('/api/admin/merchants/' + CUR.id, 'DELETE');
  if (j.code === 0) { toast('商家已删除'); closeDrawer(); load(); loadBadges(); }
  else toast(j.msg || '删除失败');
}

/* ---------- 开通商家 ---------- */
function openCreate() {
  openModal(`<h3>开通商家账号</h3>
    <div class="field"><label>企业名称 <em>*</em></label><input id="c-company" placeholder="如：东莞市恒顺智能科技" /></div>
    <div class="form-row">
      <div class="field"><label>联系人</label><input id="c-contact" placeholder="张先生" /></div>
      <div class="field"><label>手机号 <em>*</em></label><input id="c-phone" placeholder="11 位手机号，用于登录" /></div>
    </div>
    <div class="form-row">
      <div class="field"><label>初始密码</label><input id="c-pwd" placeholder="默认 123456" /></div>
      <div class="field"><label>认证状态</label>
        <select id="c-status"><option>已认证</option><option>待审核</option></select></div>
    </div>
    <div class="form-row">
      <div class="field"><label>行业</label><input id="c-industry" /></div>
      <div class="field"><label>初始点数</label><input id="c-points" type="number" value="0" /></div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="doCreate()">立即开通</button>
    </div>`, true);
}
async function doCreate() {
  const data = {
    company: $('c-company').value.trim(),
    contact: $('c-contact').value.trim(),
    phone: $('c-phone').value.trim(),
    password: $('c-pwd').value.trim() || '123456',
    status: $('c-status').value,
    industry: $('c-industry').value.trim(),
    token_balance: parseInt($('c-points').value || '0', 10),
  };
  if (!data.company) return toast('请填写企业名称');
  if (!/^\d{11}$/.test(data.phone)) return toast('请输入 11 位手机号');
  const j = await api('/api/admin/merchants', 'POST', data);
  if (j.code === 0) { toast('商家已开通'); closeModal(); setPage(1); loadBadges(); }
  else toast(j.msg || '开通失败');
}
</script>
</body>
</html>
