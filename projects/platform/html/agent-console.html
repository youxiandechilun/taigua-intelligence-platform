<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>客服工作台 - 泰卦智能</title>
<link rel="icon" href="../icons/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="../icons/favicon-32.png" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="common.css" />
<style>
body{height:100vh;overflow:hidden;background:var(--bg-soft)}
.ac{height:100vh;display:flex;flex-direction:column}

/* ---------- 顶栏 ---------- */
.ac-top{
  height:58px;flex:0 0 58px;display:flex;align-items:center;gap:14px;padding:0 18px;
  background:#131316;color:#f4f4f5;border-bottom:1px solid #26262b;
}
.ac-top img{height:28px;display:block}
.ac-top .ttl{font-size:14.5px;font-weight:600}
.ac-top .ttl small{display:block;font-family:var(--mono);font-size:10.5px;color:#71717a;letter-spacing:.12em;font-weight:400}
.ac-top .spacer{flex:1}
.ac-top .stat{
  display:flex;align-items:center;gap:7px;font-size:12.5px;color:#a1a1aa;
  border:1px solid #2c2c30;border-radius:999px;padding:4px 12px;
}
.ac-top .stat b{color:#f4f4f5;font-family:var(--mono)}
.ac-top .stat.warn{border-color:rgba(245,158,11,.45);color:#f59e0b}
.ac-top .stat.warn b{color:#f59e0b}
.ac-top .me{display:flex;align-items:center;gap:9px;font-size:13px;color:#d4d4d8;padding-left:14px;border-left:1px solid #2c2c30}
.ac-top .me .av{
  width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;
  display:grid;place-items:center;font-size:12px;font-weight:600;
}
.ac-top .me .st{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 6px rgba(74,222,128,.6)}
.ac-top button{
  background:transparent;border:1px solid #2c2c30;color:#d4d4d8;border-radius:9px;
  padding:6px 11px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:all .18s;
  display:inline-flex;align-items:center;gap:6px;
}
.ac-top button:hover{border-color:#52525b;color:#fff;background:#1f1f23}
.ac-top button.on{border-color:rgba(74,222,128,.5);color:#4ade80}

/* ---------- 三栏 ---------- */
.ac-main{flex:1;display:grid;grid-template-columns:304px minmax(0,1fr) 296px;min-height:0}
@media(max-width:1180px){.ac-main{grid-template-columns:280px 1fr}.ac-side{display:none}}
@media(max-width:820px){.ac-main{grid-template-columns:1fr}.ac-list{display:none}.ac-list.show{display:flex;position:absolute;inset:58px auto 0 0;width:300px;z-index:30;box-shadow:0 0 40px rgba(0,0,0,.2)}}

/* 左：会话列表 */
.ac-list{border-right:1px solid var(--border);background:var(--bg);display:flex;flex-direction:column;min-height:0}
.li-tabs{display:flex;gap:4px;padding:10px 10px 8px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.li-tabs button{
  flex:1;min-width:0;background:var(--bg);border:1px solid transparent;color:var(--muted);
  border-radius:8px;padding:6px 4px;font-size:12px;cursor:pointer;font-family:inherit;transition:all .18s;
  white-space:nowrap;
}
.li-tabs button:hover{background:var(--bg-soft);color:var(--text)}
.li-tabs button.on{background:var(--panel);border-color:var(--border);color:var(--text);font-weight:600}
.li-tabs button i{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--accent);margin-left:3px}
.li-search{padding:8px 10px;border-bottom:1px solid var(--border)}
.li-search input{
  width:100%;padding:7px 11px;border:1px solid var(--border);border-radius:9px;font-size:12.5px;
  background:var(--bg-soft);color:var(--text);font-family:inherit;
}
.li-search input:focus{outline:none;border-color:var(--accent)}
.li-wrap{flex:1;overflow-y:auto;min-height:0}
.ss-item{
  display:flex;gap:10px;padding:12px 13px;border-bottom:1px solid var(--border);
  cursor:pointer;transition:background .15s;position:relative;
}
.ss-item:hover{background:var(--bg-soft)}
.ss-item.active{background:var(--accent-soft)}
.ss-item.active::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.ss-item .av{
  width:36px;height:36px;flex:0 0 36px;border-radius:10px;background:var(--panel);
  border:1px solid var(--border);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--text-2);
}
.ss-item .info{min-width:0;flex:1}
.ss-item .r1{display:flex;align-items:center;gap:6px}
.ss-item .r1 b{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.ss-item .r1 .tm{font-family:var(--mono);font-size:10.5px;color:var(--muted-2);flex:0 0 auto}
.ss-item .r2{display:flex;align-items:center;gap:6px;margin-top:2px}
.ss-item .r2 span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.ss-item .r2 i{
  font-style:normal;background:var(--accent);color:#fff;font-size:10px;font-family:var(--mono);
  border-radius:999px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 5px;flex:0 0 auto;
}
.ss-item .r3{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}

/* 中：聊天区 */
.ac-chat{display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.ch-empty{flex:1;display:grid;place-items:center;color:var(--muted-2);font-size:13.5px;text-align:center;line-height:2}
.ch-head{
  height:54px;flex:0 0 54px;display:flex;align-items:center;gap:10px;padding:0 18px;
  border-bottom:1px solid var(--border);
}
.ch-head b{font-size:14px}
.ch-head .spacer{flex:1}
.ch-head .meta{font-size:12px;color:var(--muted-2);font-family:var(--mono)}
.ch-msgs{flex:1;overflow-y:auto;padding:18px clamp(20px,3vw,48px);min-height:0}
.ch-msgs .inner{display:flex;flex-direction:column;gap:14px;width:100%}
.m{display:flex;gap:9px;align-items:flex-start}
.m.me{flex-direction:row-reverse}
.m .av{width:30px;height:30px;flex:0 0 30px;border-radius:9px;display:grid;place-items:center;font-size:11.5px;font-weight:600;color:#fff;background:#18181b}
.m.me .av{background:var(--accent)}
.m .col{max-width:76%;min-width:0}
.m .who{font-size:11px;color:var(--muted-2);margin-bottom:4px;font-family:var(--mono)}
.m.me .who{text-align:right}
.m .b{
  padding:10px 14px;border-radius:13px;font-size:13.5px;line-height:1.68;white-space:pre-wrap;
  word-break:break-word;background:var(--bg-soft);border:1px solid var(--border);border-top-left-radius:4px;
}
.m.me .b{background:var(--accent);color:#fff;border-color:var(--accent);border-top-left-radius:13px;border-top-right-radius:4px}
.m.ai .av{background:#1d4ed8}
.m .tm{font-size:10px;color:var(--muted-2);font-family:var(--mono);margin-top:4px}
.m.me .tm{text-align:right}
.sys{text-align:center;margin:2px 0}
.sys span{
  font-size:11.5px;color:var(--muted);background:var(--bg-soft);border:1px solid var(--border);
  border-radius:999px;padding:3px 13px;display:inline-block;
}
.ch-foot{flex:0 0 auto;border-top:1px solid var(--border);padding:10px 16px 12px;background:var(--bg)}
.qr-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
.qr-row::-webkit-scrollbar{height:4px}
.qr-row::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:2px}
.qr-row .q{
  flex:0 0 auto;font-size:11.5px;color:var(--text-2);border:1px solid var(--border);
  border-radius:999px;padding:4px 11px;cursor:pointer;background:var(--bg-soft);transition:all .15s;white-space:nowrap;
}
.qr-row .q:hover{border-color:var(--accent);color:var(--accent)}
.ch-input{display:flex;gap:9px;align-items:flex-end}
.ch-input textarea{
  flex:1;min-height:44px;max-height:120px;resize:none;padding:11px 13px;border-radius:11px;
  border:1px solid var(--border-strong);background:var(--bg);color:var(--text);font-family:inherit;
  font-size:13.5px;line-height:1.55;
}
.ch-input textarea:focus{outline:none;border-color:var(--accent)}
.ch-input button{
  height:44px;padding:0 20px;border-radius:11px;border:1px solid var(--accent);background:var(--accent);
  color:#fff;font-size:13.5px;font-family:inherit;cursor:pointer;transition:opacity .2s;
}
.ch-input button:hover{opacity:.88}
.ch-input button:disabled{opacity:.45;cursor:not-allowed}

/* 右：客户资料 */
.ac-side{border-left:1px solid var(--border);background:var(--bg-soft);overflow-y:auto;padding:16px}
.side-card{background:var(--bg);border:1px solid var(--border);border-radius:13px;padding:15px;margin-bottom:12px}
.side-card h4{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;margin-bottom:11px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:5px 0}
.kv span{color:var(--muted);flex:0 0 auto}
.kv b{font-weight:500;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-item{border:1px solid var(--border);border-radius:10px;padding:9px 11px;margin-bottom:8px;background:var(--bg-soft)}
.tk-item b{font-size:12.5px;display:block;margin-bottom:2px}
.tk-item p{font-size:11.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tk-item .foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px}

/* 工单面板 */
#tk-pane{display:none}
#tk-pane.show{display:flex}
.tk-btns{display:flex;flex-direction:column;gap:7px;flex:0 0 auto}
.tk-btns button{height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--border-strong);
  background:var(--bg);color:var(--text);font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap}
.tk-btns button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.tk-btns button:disabled{opacity:.5;cursor:not-allowed}
.tk-detail{display:flex;flex-direction:column;gap:12px}
.tk-detail h2{font-size:16.5px;line-height:1.4}
.tk-meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.tk-block{border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:var(--bg-soft)}
.tk-block .lb{font-size:11.5px;color:var(--muted-2);margin-bottom:6px}
.tk-block .vv{font-size:13.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.tk-block.reply{border-color:var(--accent);background:var(--accent-soft)}
.ss-item .tkm{font-size:11px;color:var(--muted-2)}

/* 弹窗/提示 */
#toast{position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-80px);z-index:999;
  background:var(--text);color:var(--bg);padding:10px 22px;border-radius:999px;font-size:13.5px;
  transition:transform .3s ease;box-shadow:var(--shadow)}
#toast.show{transform:translateX(-50%) translateY(0)}
.mask{position:fixed;inset:0;background:rgba(24,24,27,.45);z-index:200;display:none;align-items:flex-start;justify-content:center;padding:70px 20px;overflow-y:auto}
.mask.show{display:flex}
.modal{background:var(--bg);border:1px solid var(--border);border-radius:16px;width:100%;max-width:480px;padding:24px;box-shadow:var(--shadow)}
.modal h3{font-size:16px;margin-bottom:14px}
.modal .foot{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}
</style>
</head>
<body>
<div class="ac">
  <header class="ac-top">
    <a href="agent-console.html"><img src="../assets/logo.jpg" alt="泰卦智能" /></a>
    <div class="ttl">客服工作台<small>AGENT CONSOLE</small></div>
    <div class="spacer"></div>
    <div class="stat warn" id="s-waiting" style="display:none">待接入 <b>0</b></div>
    <div class="stat" id="s-mine">进行中 <b>0</b></div>
    <div class="stat" id="s-today">今日会话 <b>0</b></div>
    <button id="btn-sound" title="提示音开关">🔔 提示音</button>
    <button id="btn-sound-test" title="试听提示音">试听</button>
    <div class="me">
      <div class="av" id="me-av">客</div>
      <div>
        <div id="me-name" style="line-height:1.2">加载中…</div>
        <div style="font-size:11px;color:#71717a;display:flex;align-items:center;gap:5px;margin-top:2px">
          <span class="st"></span><span id="me-status">在线</span>
        </div>
      </div>
    </div>
    <button onclick="location.reload()">刷新</button>
    <button id="btn-logout">退出</button>
  </header>

  <div class="ac-main">
    <!-- 左 -->
    <aside class="ac-list" id="list-panel">
      <div class="li-tabs">
        <button data-tab="all" class="on">全部</button>
        <button data-tab="pending">待接入<i id="t-pending"></i></button>
        <button data-tab="human">进行中</button>
        <button data-tab="ai">AI应答</button>
        <button data-tab="ticket">工单<i id="t-tickets"></i></button>
      </div>
      <div class="li-search"><input id="li-search" placeholder="搜索商家 / 手机号 / 消息…" /></div>
      <div class="li-wrap" id="ss-list">
        <div style="padding:30px 16px;text-align:center;color:var(--muted-2);font-size:12.5px">加载中…</div>
      </div>
    </aside>

    <!-- 中 -->
    <section class="ac-chat" id="chat-pane">
      <div id="chat-head" class="ch-head" style="display:none"></div>
      <div class="ch-msgs" id="chat-msgs">
        <div class="ch-empty" id="ch-empty">
          从左侧选择一个会话开始服务<br/>
          <span style="font-size:12px">新会话到达时会有提示音</span>
        </div>
      </div>
      <div class="ch-foot" id="ch-foot" style="display:none">
        <div class="qr-row" id="qr-row"></div>
        <div class="ch-input">
          <textarea id="reply-input" placeholder="输入回复内容，Enter 发送 / Shift+Enter 换行"></textarea>
          <button id="btn-send">发送</button>
        </div>
      </div>
    </section>

    <!-- 工单详情 -->
    <section class="ac-chat" id="tk-pane">
      <div class="ch-head" id="tk-head"></div>
      <div class="ch-msgs" id="tk-body"><div class="inner" id="tk-inner"></div></div>
      <div class="ch-foot" id="tk-foot">
        <div class="ch-input">
          <textarea id="tk-input" placeholder="输入工单回复内容…"></textarea>
          <div class="tk-btns">
            <button class="primary" id="tk-send-close">回复并关闭</button>
            <button id="tk-send-keep">仅回复</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 右 -->
    <aside class="ac-side" id="side-panel">
      <div class="side-card" id="cust-card">
        <h4>客户信息</h4>
        <div class="kv"><span>商家</span><b>—</b></div>
      </div>
      <div class="side-card" id="sess-card">
        <h4>会话信息</h4>
        <div class="kv"><span>状态</span><b>—</b></div>
      </div>
      <div class="side-card" id="ticket-card">
        <h4>该商家工单</h4>
        <div style="font-size:12px;color:var(--muted-2)">选择会话后展示</div>
      </div>
    </aside>
  </div>
</div>

<div id="toast"></div>
<script>
const $ = id => document.getElementById(id);
const CS_KEY = 'tk_cs_token';
const CS_TOKEN = localStorage.getItem(CS_KEY) || '';
const CSE = {};
let pollDead = false;   // 登录失效后停止轮询

document.documentElement.setAttribute('data-theme', localStorage.getItem('tk-theme') || 'light');

/* ============ 请求 ============ */
const REQ_TIMEOUT = 8000;
async function csapi(path, method = 'GET', body) {
  const opt = { method, headers: { 'X-CS-Token': CS_TOKEN }, cache: 'no-store' };
  if (body !== undefined) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  // 必须带超时：否则某个请求卡住会一直占着浏览器连接，页面就表现为「卡死」
  const ctl = new AbortController();
  const tid = setTimeout(() => ctl.abort(), REQ_TIMEOUT);
  opt.signal = ctl.signal;
  let res;
  try { res = await fetch(path, opt); }
  catch (e) { clearTimeout(tid); return { code: -1, msg: (e && e.name === 'AbortError') ? '请求超时' : '网络异常' }; }
  clearTimeout(tid);
  let j;
  try { j = await res.json(); } catch (e) { j = { code: res.status, msg: '服务异常' }; }
  if (j.code === 401) {
    pollDead = true;
    localStorage.removeItem(CS_KEY);
    location.href = 'agent-login.html';
  }
  return j;
}

let toastTimer;
function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function hhmm(s) { return (s || '').slice(11, 16); }
function fmt(s) { return (s || '').replace('T', ' ').slice(0, 16) || '—'; }

/* ============ 提示音 ============ */
let AC = null, SOUND_ON = localStorage.getItem('tk-cs-sound') !== 'off';
function unlock() {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
}
document.addEventListener('click', unlock);
document.addEventListener('keydown', unlock);

function beep(kind) {
  if (!SOUND_ON) return;
  unlock(); if (!AC) return;
  const seq = kind === 'agent'
    ? [[880, 0, .13, .2], [1318.5, .13, .2, .18]]
    : [[740, 0, .1, .14], [988, .12, .12, .12]];
  seq.forEach(([f, delay, dur, vol]) => {
    const o = AC.createOscillator(), g = AC.createGain();
    const t = AC.currentTime + delay;
    o.type = 'sine'; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + .02);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + .05);
  });
}
function renderSound() {
  const b = $('btn-sound');
  b.classList.toggle('on', SOUND_ON);
  b.textContent = SOUND_ON ? '🔔 提示音' : '🔇 已静音';
}
$('btn-sound').onclick = () => {
  SOUND_ON = !SOUND_ON;
  localStorage.setItem('tk-cs-sound', SOUND_ON ? 'on' : 'off');
  renderSound();
  if (SOUND_ON) beep('agent');
  toast(SOUND_ON ? '提示音已开启' : '提示音已静音');
};
$('btn-sound-test').onclick = () => { unlock(); beep('agent'); toast('这就是新消息提示音'); };

/* ============ 状态 ============ */
let ME = null, LIST = [], SESS = null, MSGS = [], LAST_ID = 0, TAB = 'all', KEYWORD = '', LIST_SIG = '';
let OPEN_SEQ = 0;   // 打开会话的请求序号，用于丢弃过期响应
let PREV = { pending: 0, unread: 0, tickets: 0 }, CUR_ID = 0;
let TICKETS = [], TICKET = null, TICKET_SIG = '';

/* ============ 会话列表 ============ */
function statusBadge(s) {
  if (s === 'pending') return '<span class="badge warn">待接入</span>';
  if (s === 'human') return '<span class="badge green">人工中</span>';
  if (s === 'ai') return '<span class="badge">AI应答</span>';
  if (s === 'closed') return '<span class="badge">已结束</span>';
  return '<span class="badge">' + esc(s) + '</span>';
}
function waitText(s) {
  if (s.status !== 'pending') return '';
  const t0 = new Date((s.created_at || '').replace(' ', 'T')).getTime();
  const mins = Math.max(0, Math.round((Date.now() - t0) / 60000));
  return `<span class="badge warn">排队 ${mins} 分钟</span>`;
}

function renderList() {
  const wrap = $('ss-list');
  if (TAB === 'ticket') { renderTicketList(); return; }
  let arr = LIST.filter(s => {
    if (TAB === 'pending') return s.status === 'pending';
    if (TAB === 'human') return s.status === 'human';
    if (TAB === 'ai') return s.status === 'ai';
    return true;
  });
  if (KEYWORD) {
    const k = KEYWORD.toLowerCase();
    arr = arr.filter(s => {
      const m = s.merchant || {};
      return (m.company || '').toLowerCase().includes(k) || (m.phone || '').includes(k)
        || (s.last_msg || '').toLowerCase().includes(k);
    });
  }
  if (!arr.length) {
    wrap.innerHTML = '<div style="padding:34px 16px;text-align:center;color:var(--muted-2);font-size:12.5px">暂无会话</div>';
    return;
  }
  wrap.innerHTML = arr.map(s => {
    const m = s.merchant || {};
    const name = m.company || ('商家 #' + s.merchant_id);
    const own = s.agent ? s.agent.name : '';
    return `<div class="ss-item${CUR_ID === s.id ? ' active' : ''}" onclick="openSession(${s.id})">
      <div class="av">${esc(name.slice(0, 1))}</div>
      <div class="info">
        <div class="r1"><b>${esc(name)}</b><span class="tm">${hhmm(s.last_msg_at || s.created_at)}</span></div>
        <div class="r2"><span>${esc(s.last_msg || '（暂无消息）')}</span>${s.unread_agent > 0 ? `<i>${s.unread_agent}</i>` : ''}</div>
        <div class="r3">${statusBadge(s.status)}${waitText(s)}${own ? `<span class="badge">${esc(own)}</span>` : ''}</div>
      </div>
    </div>`;
  }).join('');
}

async function loadList(silent) {
  const j = await csapi('/api/cs/agent/sessions');
  if (j.code !== 0) return;
  LIST = j.data.list || [];
  const c = j.data.counts || {};
  $('s-waiting').style.display = (c.pending > 0) ? '' : 'none';
  $('s-waiting').innerHTML = '待接入 <b>' + c.pending + '</b>';
  $('s-mine').innerHTML = '进行中 <b>' + c.human + '</b>';
  $('t-pending').textContent = c.pending ? c.pending : '';

  // 新会话 / 新消息提醒
  if (!silent && (c.pending > PREV.pending || c.unread > PREV.unread)) beep('agent');
  PREV = { pending: c.pending, unread: c.unread,
           tickets: c.tickets_pending == null ? PREV.tickets : c.tickets_pending };
  const tb = $('t-tickets');
  if (tb) tb.textContent = PREV.tickets ? PREV.tickets : '';

  LIST_SIG = JSON.stringify(LIST) + JSON.stringify(c);
  renderList();
  loadStats();
}

/* ============ 工单队列 ============ */
const STATUS_TK = s => s === '已关闭'
  ? '<span class="badge">已关闭</span>'
  : '<span class="badge warn">处理中</span>';

function renderTicketList() {
  const wrap = $('ss-list');
  let arr = TICKETS.slice();
  if (KEYWORD) {
    const k = KEYWORD.toLowerCase();
    arr = arr.filter(t => (t.title || '').toLowerCase().includes(k)
      || (t.company || '').toLowerCase().includes(k)
      || (t.content || '').toLowerCase().includes(k));
  }
  if (!arr.length) {
    wrap.innerHTML = '<div style="padding:34px 16px;text-align:center;color:var(--muted-2);font-size:12.5px">暂无工单</div>';
    return;
  }
  wrap.innerHTML = arr.map(t => {
    const who = t.handler ? `处理人 ${esc(t.handler)}` : '未接手';
    const active = TICKET && TICKET.id === t.id ? ' active' : '';
    return `<div class="ss-item${active}" onclick="openTicket(${t.id})">
      <div class="av">单</div>
      <div class="info">
        <div class="r1"><b>${esc(t.title)}</b><span class="tm">${hhmm(t.created_at)}</span></div>
        <div class="r2"><span>${esc(t.company || ('商家 #' + t.merchant_id))} · ${esc(t.content || '')}</span></div>
        <div class="r3">${STATUS_TK(t.status)}<span class="badge">${esc(t.category || '其他')}</span>
          <span class="badge${t.handler ? '' : ' warn'}">${esc(who)}</span></div>
      </div>
    </div>`;
  }).join('');
}

async function loadTicketQueue(silent) {
  const j = await csapi('/api/cs/agent/tickets');
  if (j.code !== 0) return;
  const d = j.data || {};
  TICKETS = d.list || [];
  const n = (d.counts || {}).pending || 0;
  const badge = $('t-tickets');
  if (badge) badge.textContent = n ? n : '';
  const sig = JSON.stringify(TICKETS.map(t => [t.id, t.status, t.handler, t.reply]));
  if (sig !== TICKET_SIG) {
    TICKET_SIG = sig;
    if (!silent && n > PREV.tickets) beep('agent');
    PREV.tickets = n;
    if (TAB === 'ticket') renderTicketList();
    if (TICKET) {
      const fresh = TICKETS.find(x => x.id === TICKET.id);
      if (fresh) { TICKET = fresh; renderTicketDetail(); }
    }
  }
}

function showChatPane() {
  $('tk-pane').classList.remove('show');
  $('chat-pane').style.display = '';
}
function showTicketPane() {
  $('chat-pane').style.display = 'none';
  $('tk-pane').classList.add('show');
}

window.openTicket = async function (id) {
  let t = TICKETS.find(x => x.id === id);
  if (!t) { await loadTicketQueue(true); t = TICKETS.find(x => x.id === id); }
  if (!t) return toast('工单不存在或已删除');
  TICKET = t;
  showTicketPane();
  renderTicketDetail();
  if (TAB === 'ticket') renderTicketList();
  // 未关闭且无人接手：自动接手，避免多人重复回复
  if (t.status !== '已关闭' && !t.handler) {
    const j = await csapi('/api/cs/agent/ticket-claim', 'POST', { ticket_id: id });
    if (j.code === 0) { TICKET.handler = j.data ? j.data.handler : t.handler; toast('已接手工单'); loadTicketQueue(true); }
    else if (j.code === 409) { toast(j.msg); loadTicketQueue(true); }
  }
  const inp = $('tk-input');
  if (inp && !inp.disabled) inp.focus();
};

function renderTicketDetail() {
  if (!TICKET) return;
  const t = TICKET;
  const closed = t.status === '已关闭';
  $('tk-head').innerHTML = `
    <b>工单 #${t.id}</b>
    ${STATUS_TK(t.status)}
    <span class="badge">${esc(t.category || '其他')}</span>
    ${t.handler ? `<span class="badge">处理人 ${esc(t.handler)}</span>` : '<span class="badge warn">未接手</span>'}
    <div class="spacer"></div>
    <span class="meta">${esc(t.company || ('商家 #' + t.merchant_id))} · 提交于 ${fmt(t.created_at)}</span>
    <button class="btn btn-sm" onclick="closeTicketView()">返回会话</button>`;
  $('tk-inner').innerHTML = `<div class="tk-detail">
    <h2>${esc(t.title)}</h2>
    <div class="tk-meta">
      <span>商家：${esc(t.company || '—')}</span>
      <span>手机号：${esc(t.merchant_phone || '—')}</span>
      <span>优先级：${esc(t.priority || '普通')}</span>
    </div>
    <div class="tk-block"><div class="lb">工单内容</div><div class="vv">${esc(t.content || '（无正文）')}</div></div>
    ${t.reply ? `<div class="tk-block reply"><div class="lb">已回复 · ${esc(t.replied_by || '')} · ${fmt(t.replied_at)}</div>
      <div class="vv">${esc(t.reply)}</div></div>` : ''}
    ${closed ? '' : '<div class="tk-meta" style="font-size:11.5px">回复后可选「仅回复」保持处理中，或「回复并关闭」直接结单。</div>'}
  </div>`;
  const inp = $('tk-input');
  inp.disabled = closed;
  inp.value = '';
  inp.placeholder = closed ? '工单已关闭' : '输入工单回复内容…';
  $('tk-send-close').disabled = closed;
  $('tk-send-keep').disabled = closed;
}

window.closeTicketView = function () {
  TICKET = null;
  showChatPane();
  if (TAB === 'ticket') renderTicketList();
};

async function submitTicketReply(status) {
  if (!TICKET) return;
  const inp = $('tk-input');
  const txt = inp.value.trim();
  if (!txt) return toast('请输入回复内容');
  $('tk-send-close').disabled = true;
  $('tk-send-keep').disabled = true;
  const j = await csapi('/api/cs/agent/ticket-reply', 'POST',
    { ticket_id: TICKET.id, reply: txt, status });
  if (j.code !== 0) {
    toast(j.msg || '回复失败');
    $('tk-send-close').disabled = false;
    $('tk-send-keep').disabled = false;
    return;
  }
  toast(j.msg || '已回复');
  TICKET_SIG = '';                 // 强制下次刷新重绘
  await loadTicketQueue(true);
  if (TICKET) renderTicketDetail();
}

$('tk-send-close').onclick = () => submitTicketReply('已关闭');
$('tk-send-keep').onclick = () => submitTicketReply('处理中');
$('tk-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submitTicketReply('已关闭'); }
});
$('tk-input').addEventListener('input', e => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(120, e.target.scrollHeight) + 'px';
});

async function loadStats() {
  const j = await csapi('/api/cs/agent/stats');
  if (j.code === 0) $('s-today').innerHTML = '今日会话 <b>' + j.data.today_sessions + '</b>';
}

/* ============ 打开会话 ============ */
async function openSession(id) {
  const seq = ++OPEN_SEQ;          // 本次打开请求的身份
  CUR_ID = id;
  TICKET = null;
  showChatPane();
  SESS = null; MSGS = []; LAST_ID = 0;   // 立刻清空，避免闪现上一个会话的消息
  renderList();
  const j = await csapi('/api/cs/agent/session/' + id + '?since=0');
  if (seq !== OPEN_SEQ) return;    // 期间又点了别的会话，丢弃这次结果
  if (j.code !== 0) {
    toast(j.msg || '打开失败');
    // 清空旧会话残留，避免误以为是当前会话
    $('chat-head').style.display = 'none';
    $('ch-foot').style.display = 'none';
    $('chat-msgs').innerHTML = '<div class="ch-empty" id="ch-empty">打开会话失败：' + esc(j.msg || '未知错误') + '</div>';
    return;
  }
  SESS = j.data.session;
  MSGS = j.data.messages || [];
  LAST_ID = MSGS.length ? MSGS[MSGS.length - 1].id : 0;
  renderChat();
  renderSide();
  loadTickets(SESS.merchant_id);
  if (SESS.status === 'pending') {
    // 待接入的会话，自动尝试接入
    const r = await csapi('/api/cs/agent/claim', 'POST', { session_id: id });
    if (seq !== OPEN_SEQ) return;
    if (r.code === 0) { toast('已接入会话'); await refreshCurrent(); loadList(true); }
    else if (r.code === 409) { toast(r.msg); loadList(true); }
  }
  const inp = $('reply-input');
  if (inp && !inp.disabled) inp.focus();
}

async function refreshCurrent() {
  const id = CUR_ID;
  if (!id) return;
  const j = await csapi('/api/cs/agent/session/' + id + '?since=0');
  if (j.code !== 0 || id !== CUR_ID) return;   // 期间切了会话，旧结果直接丢弃
  SESS = j.data.session; MSGS = j.data.messages || [];
  LAST_ID = MSGS.length ? MSGS[MSGS.length - 1].id : 0;
  renderChat(); renderSide();
}

/* ============ 聊天渲染 ============ */
function msgHtml(x) {
  if (x.sender === 'system') return `<div class="sys"><span>${esc(x.content)}</span></div>`;
  const isMe = x.sender === 'agent';
  const isAi = x.sender === 'ai';
  const m = (SESS && SESS.merchant) || {};
  const who = isMe ? (ME ? ME.name : '客服') : (isAi ? 'AI 客服' : (m.company || '客户'));
  const av = isMe ? (ME ? ME.name.slice(0, 1) : '客') : (isAi ? 'AI' : '客');
  return `<div class="m ${isMe ? 'me' : (isAi ? 'ai' : '')}">
    <div class="av">${esc(av)}</div>
    <div class="col">
      <div class="who">${esc(who)} · ${hhmm(x.created_at)}</div>
      <div class="b">${esc(x.content)}</div>
    </div>
  </div>`;
}

function nearBottom(box) { return box.scrollHeight - box.scrollTop - box.clientHeight < 90; }

/* 只追加新消息，不整块重绘：不打断阅读、不跳滚动条、也不卡 */
function appendMsgs(arr) {
  if (!arr.length) return;
  const box = $('chat-msgs');
  const inner = document.getElementById('ch-inner');
  if (!inner) { renderChat(); return; }
  const stick = nearBottom(box);
  inner.insertAdjacentHTML('beforeend', arr.map(msgHtml).join(''));
  if (stick) box.scrollTop = box.scrollHeight;
}

function renderChat() {
  if (!SESS) return;
  // 注意：#ch-empty 在第一次渲染时会被下面的 innerHTML 覆盖掉，
  // 之后 $('ch-empty') 就是 null，必须判空，否则这里抛 TypeError 会让整个渲染中断，
  // 表现为「切换会话后页面冻住、能发消息但界面不更新」。
  const em = $('ch-empty');
  if (em) em.style.display = 'none';
  $('chat-head').style.display = '';
  $('ch-foot').style.display = '';
  const m = SESS.merchant || {};
  $('chat-head').innerHTML = `
    <b>${esc(m.company || ('商家 #' + SESS.merchant_id))}</b>
    ${statusBadge(SESS.status)}
    ${SESS.agent ? `<span class="badge">客服 ${esc(SESS.agent.name)}</span>` : ''}
    <div class="spacer"></div>
    <span class="meta">会话 #${SESS.id} · 创建于 ${fmt(SESS.created_at)}</span>
    <button class="btn btn-sm" onclick="loadTickets(${SESS.merchant_id})">刷新工单</button>
    ${SESS.status === 'closed' ? '' : `<button class="btn btn-sm btn-danger" onclick="closeSession()">结束会话</button>`}
  `;

  const box = $('chat-msgs');
  const LIMIT = 300;
  const cut = MSGS.length > LIMIT;
  const shown = cut ? MSGS.slice(-LIMIT) : MSGS;
  const tip = cut ? `<div class="sys"><span>更早的 ${MSGS.length - LIMIT} 条消息已省略</span></div>` : '';
  box.innerHTML = `<div class="inner" id="ch-inner">${tip}${shown.map(msgHtml).join('')}</div>`;
  box.scrollTop = box.scrollHeight;

  const editable = SESS.status !== 'closed';
  $('reply-input').disabled = !editable;
  $('btn-send').disabled = !editable;
  $('reply-input').placeholder = editable ? '输入回复内容，Enter 发送 / Shift+Enter 换行' : '会话已结束，无法回复';
}

/* ============ 右侧资料 ============ */
function renderSide() {
  const m = (SESS && SESS.merchant) || {};
  $('cust-card').innerHTML = `
    <h4>客户信息</h4>
    <div class="kv"><span>商家</span><b>${esc(m.company || '—')}</b></div>
    <div class="kv"><span>联系人</span><b>${esc(m.contact || '—')}</b></div>
    <div class="kv"><span>手机号</span><b>${esc(m.phone || '—')}</b></div>
    <div class="kv"><span>邮箱</span><b>${esc(m.email || '—')}</b></div>
    <div class="kv"><span>认证状态</span><b>${esc(m.status || '—')}</b></div>
    <div class="kv"><span>点数余额</span><b>${m.token_balance == null ? '—' : Number(m.token_balance).toLocaleString()}</b></div>
    <div class="kv"><span>注册时间</span><b>${fmt(m.created_at)}</b></div>`;
  $('sess-card').innerHTML = `
    <h4>会话信息</h4>
    <div class="kv"><span>状态</span><b>${SESS ? esc(SESS.status) : '—'}</b></div>
    <div class="kv"><span>模式</span><b>${SESS ? (SESS.mode === 'ai' ? 'AI 应答' : '人工') : '—'}</b></div>
    <div class="kv"><span>消息条数</span><b>${MSGS.length}</b></div>
    <div class="kv"><span>开始时间</span><b>${SESS ? fmt(SESS.created_at) : '—'}</b></div>
    <div class="kv"><span>接入时间</span><b>${SESS ? fmt(SESS.claimed_at) : '—'}</b></div>`;

async function loadTickets(mid) {
  const card = $('ticket-card');
  if (!mid) return;
  const j = await csapi('/api/cs/agent/tickets?merchant_id=' + mid);
  if (j.code !== 0) return;
  const list = (j.data && j.data.list) || [];
  // 合并进工单缓存，点卡片可直接打开详情面板
  list.forEach(t => {
    const i = TICKETS.findIndex(x => x.id === t.id);
    if (i < 0) TICKETS.push(t); else TICKETS[i] = t;
  });
  if (!list.length) {
    card.innerHTML = '<h4>该商家工单</h4><div style="font-size:12px;color:var(--muted-2)">暂无工单</div>';
    return;
  }
  card.innerHTML = '<h4>该商家工单（' + list.length + '）</h4>' + list.slice(0, 6).map(t => `
    <div class="tk-item" style="cursor:pointer" onclick="openTicket(${t.id})">
      <b>${esc(t.title)}</b>
      <p>${esc(t.content)}</p>
      <div class="foot">
        <span class="badge ${t.status === '已关闭' ? 'green' : 'warn'}">${esc(t.status)}</span>
        <span style="font-size:11px;color:var(--muted-2)">${t.handler ? '处理人 ' + esc(t.handler) : '未接手'}</span>
      </div>
    </div>`).join('');
}
/* ============ 发送 / 结束 ============ */
async function sendReply() {
  const t = $('reply-input');
  const content = t.value.trim();
  if (!content || !SESS) return;
  $('btn-send').disabled = true;
  const j = await csapi('/api/cs/agent/reply', 'POST', { session_id: SESS.id, content });
  $('btn-send').disabled = false;
  if (j.code !== 0) { toast(j.msg || '发送失败'); return; }
  t.value = ''; t.style.height = 'auto';
  await refreshCurrent();
  loadList(true);
}
$('btn-send').onclick = sendReply;
$('reply-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendReply(); }
});
$('reply-input').addEventListener('input', e => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(120, e.target.scrollHeight) + 'px';
});

window.closeSession = async function () {
  if (!SESS) return;
  if (!confirm('确定结束会话 #' + SESS.id + ' 吗？结束后客户需重新发起咨询。')) return;
  const j = await csapi('/api/cs/agent/close', 'POST', { session_id: SESS.id });
  if (j.code === 0) { toast('会话已结束'); await refreshCurrent(); loadList(true); }
  else toast(j.msg || '操作失败');
};

/* ============ 轮询（单飞 + 自调度，绝不堆积请求）============ */
const POLL_MS = 2500;
let pollTimer = null, polling = false;

function schedulePoll(delay) {
  clearTimeout(pollTimer);
  if (pollDead) return;
  pollTimer = setTimeout(poll, delay == null ? POLL_MS : delay);
}

/* 把一次轮询的结果应用到界面 */
function applyPoll(d) {
  if (!d) return;
  const c = d.counts || {};

  // 工单：角标 + 新工单提示音 + 队列刷新（与会话列表签名无关，单独处理）
  const tp = c.tickets_pending == null ? PREV.tickets : c.tickets_pending;
  if (tp !== PREV.tickets) {
    if (tp > PREV.tickets) beep('agent');
    const tb = $('t-tickets');
    if (tb) tb.textContent = tp ? tp : '';
    PREV.tickets = tp;
    if (TAB === 'ticket') loadTicketQueue(true);
  }
  const sig = JSON.stringify(d.list || []) + JSON.stringify(c);
  if (sig !== LIST_SIG) {
    LIST_SIG = sig;
    LIST = d.list || [];
    $('s-waiting').style.display = (c.pending > 0) ? '' : 'none';
    $('s-waiting').innerHTML = '待接入 <b>' + c.pending + '</b>';
    $('s-mine').innerHTML = '进行中 <b>' + c.human + '</b>';
    $('t-pending').textContent = c.pending ? c.pending : '';
    if (c.pending > PREV.pending || c.unread > PREV.unread) beep('agent');
    PREV = { pending: c.pending, unread: c.unread };
    renderList();
  }
  if (d.stats) $('s-today').innerHTML = '今日会话 <b>' + d.stats.today_sessions + '</b>';

  if (d.session) {
    if (d.session.id !== CUR_ID) return;   // 不是当前会话，忽略
    const prevStatus = SESS ? SESS.status : '';
    SESS = d.session;
    const added = (d.messages || []).filter(m => !MSGS.some(x => x.id === m.id));
    if (added.length) {
      MSGS = MSGS.concat(added).sort((a, b) => a.id - b.id);
      LAST_ID = MSGS[MSGS.length - 1].id;
      appendMsgs(added);
      renderSide();
      if (added.some(m => m.sender === 'user')) beep('agent');
    }
    if (prevStatus !== SESS.status) renderChat();
  }
}

async function poll() {
  if (pollDead) return;
  if (polling) { schedulePoll(600); return; }   // 上一轮还没回来，本轮直接跳过
  polling = true;
  try {
    if (!document.hidden) {
      const sid = CUR_ID;
      const j = await csapi('/api/cs/agent/poll?session_id=' + (sid || 0) + '&since=' + LAST_ID);
      if (j.code === 0) {
        const d = j.data || {};
        // 请求在途期间客服切了会话：消息/会话对象属于旧会话，丢弃，只保留列表与统计
        if (sid !== CUR_ID) { d.session = null; d.messages = null; }
        applyPoll(d);
      }
    }
  } catch (e) {
    /* 网络抖动：忽略，下一轮自动重试 */
  } finally {
    polling = false;
    schedulePoll();
  }
}

function startPoll() { pollDead = false; schedulePoll(0); }

// 切回标签页立刻拉一次，不用等下一个周期
document.addEventListener('visibilitychange', () => { if (!document.hidden) { poll(); unlock(); } });

/* ============ 启动 ============ */
(async () => {
  renderSound();
  if (!CS_TOKEN) { location.href = 'agent-login.html'; return; }
  const j = await csapi('/api/cs/agent/me');
  if (j.code !== 0) { location.href = 'agent-login.html'; return; }
  ME = j.data;
  $('me-av').textContent = (ME.name || '客').slice(0, 1);
  $('me-name').textContent = ME.name + ' · ' + ME.no;
  $('me-status').textContent = ME.role === 'supervisor' ? '客服主管' : '在线';

  const q = await csapi('/api/cs/agent/quick-replies');
  const qr = q.code === 0 ? q.data : [];
  $('qr-row').innerHTML = qr.map(t =>
    `<span class="q" onclick="useQuick(this)" title="${esc(t)}">${esc(t.length > 18 ? t.slice(0, 18) + '…' : t)}</span>`
  ).join('');

  await loadList(true);
  loadTicketQueue(true);
  startPoll();

  // 心跳
  setInterval(() => { if (!document.hidden) csapi('/api/cs/agent/heartbeat', 'POST', {}); }, 30000);

  // Tab 切换
  document.querySelectorAll('.li-tabs button').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('.li-tabs button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      TAB = b.dataset.tab;
      if (TAB === 'ticket') {
        renderList();                 // 先用缓存渲染，避免空白
        loadTicketQueue(true);
      } else {
        TICKET = null;
        showChatPane();
        renderList();
      }
    };
  });
  $('li-search').addEventListener('input', e => { KEYWORD = e.target.value.trim(); renderList(); });

  $('btn-logout').onclick = async () => {
    if (!confirm('确定退出客服工作台？')) return;
    await csapi('/api/cs/agent/logout', 'POST', {});
    localStorage.removeItem(CS_KEY);
    location.href = 'agent-login.html';
  };

})();

window.useQuick = function (el) {
  $('reply-input').value = el.getAttribute('title');
  $('reply-input').focus();
};
</script>
</body>
</html>
