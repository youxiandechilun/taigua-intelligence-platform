<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>客服中心 - 泰卦智能 商家服务平台</title>
<link rel="icon" href="../icons/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="../icons/favicon-32.png" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="common.css" />
<style>
.layout{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:start}
@media(max-width:1000px){.layout{grid-template-columns:1fr}}

/* 在线客服入口卡 */
.entry{display:flex;gap:18px;align-items:flex-start}
.entry .ico{
  width:56px;height:56px;flex:0 0 56px;border-radius:16px;background:var(--accent-soft);
  border:1px solid rgba(192,57,43,.28);display:grid;place-items:center;font-size:24px;
}
.entry .body{flex:1;min-width:0}
.entry h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.entry p{font-size:13px;color:var(--muted);margin-top:7px;line-height:1.75}
.entry .acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.preview{
  margin-top:16px;border:1px solid var(--border);border-radius:12px;background:var(--bg);
  padding:13px 15px;font-size:12.5px;color:var(--muted);line-height:1.8;max-height:120px;overflow:hidden;position:relative;
}
.preview .p{display:flex;gap:8px;margin-bottom:4px}
.preview .p b{color:var(--text-2);font-weight:500;flex:0 0 auto}
.preview .p span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview .more{
  position:absolute;left:0;right:0;bottom:0;height:34px;
  background:linear-gradient(transparent,var(--bg));display:grid;place-items:end center;
}

/* 工单 */
.tk-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.tk-head .l{display:flex;align-items:center;gap:10px}
.tk-head h3{font-size:15px;font-weight:600}
.tk-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tk-scroll{max-height:600px;overflow:auto;padding-right:4px}
.tk-item{border:1px solid var(--border);border-radius:12px;padding:13px 15px;margin-bottom:10px;background:var(--bg);transition:border-color .2s}
.tk-item:hover{border-color:var(--border-strong)}
.tk-item .r1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tk-item .r1 b{font-size:13.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-item .r1 .tm{font-family:var(--mono);font-size:11px;color:var(--muted-2)}
.tk-item .r2{font-size:12.5px;color:var(--muted);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tk-item .r3{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tk-item .reply{
  margin-top:9px;padding:9px 12px;border-radius:9px;background:var(--bg-soft);
  border-left:2px solid var(--ok);font-size:12.5px;color:var(--text-2);line-height:1.7;
}
.empty{padding:34px 10px;text-align:center;color:var(--muted-2);font-size:13px}
</style>
</head>
<body>
<div class="console">
  <div id="sidebar-root"></div>
  <main class="main">
    <div class="main-inner">
      <div class="page-head">
        <span class="sec-tag">Support Center</span>
        <h1>客服中心</h1>
        <p>AI 客服 7×24 在线，人工客服接入后实时提醒</p>
      </div>

      <!-- 平台公告（新公告进入页面会自动弹窗提示，点「我知道了」后不再弹） -->
      <div id="ann-box" style="display:none;margin-bottom:20px"></div>

      <div class="layout">
        <!-- 左：在线客服 -->
        <div class="card plain">
          <div class="entry">
            <div class="ico">💬</div>
            <div class="body">
              <h3>在线客服 <span class="badge green" id="cs-badge">AI 智能应答</span></h3>
              <p>AI 客服秒级响应常见问题；需要人工时点「转人工」，客服接入后会实时提醒您。工单处理进度在右侧「我的工单」查看。</p>
              <div class="acts">
                <a class="btn btn-primary" href="/zt/chat">进入会话</a>
                <a class="btn" href="chat.html?human=1" id="btn-human-quick">转人工</a>
                <a class="btn" href="javascript:;" onclick="openTicketModal()">提交工单</a>
              </div>
            </div>
          </div>
          <div class="preview" id="preview">
            <div class="p"><b>提示：</b><span>暂无历史会话，点击「进入会话」开始咨询。</span></div>
          </div>
          <div class="divider" style="margin:16px 0 12px"></div>
          <div class="small muted">📞 兜底客服电话：<b class="mono" style="color:var(--text-2)">18925568615</b>（工作日 09:00–18:30）</div>
        </div>

        <!-- 右：我的工单 -->
        <div class="card plain">
          <div class="tk-head">
            <div class="l">
              <h3>我的工单</h3>
              <span class="badge" id="tk-count">0</span>
            </div>
            <div class="tk-actions">
              <a class="btn btn-sm" href="javascript:;" onclick="loadTickets()">刷新</a>
              <button class="btn btn-primary btn-sm" onclick="openTicketModal()">＋ 提交工单</button>
            </div>
          </div>
          <div class="tk-scroll" id="tk-list"><div class="empty">加载中…</div></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="common.js"></script>
<script>
const $ = s => document.querySelector(s);
const f = id => document.getElementById(id);
let ME = null;

(async () => {
  ME = await initConsole('support.html');
  if (!ME) return;
  loadTickets();
  loadPreview();
})();

/* ---------- 最近会话预览 ---------- */
async function loadPreview() {
  const j = await api('/api/cs/poll?since=0');
  if (j.code !== 0 || !j.data.session) return;
  const s = j.data.session;
  const badge = f('cs-badge');
  if (s.status === 'human') { badge.className = 'badge green'; badge.textContent = '人工客服' + (s.agent ? ' · ' + s.agent.name : ''); }
  else if (s.status === 'pending') { badge.className = 'badge warn'; badge.textContent = '等待人工接入'; }
  else if (s.status === 'closed') { badge.className = 'badge'; badge.textContent = '上次会话已结束'; }
  else { badge.className = 'badge green'; badge.textContent = 'AI 智能应答'; }

  const msgs = (j.data.messages || []).slice(-3);
  if (!msgs.length) return;
  f('preview').innerHTML = msgs.map(m => {
    const who = m.sender === 'user' ? '我' : (m.sender === 'ai' ? 'AI' : (m.sender === 'agent' ? '客服' : '系统'));
    return `<div class="p"><b>${who}：</b><span>${esc(String(m.content).slice(0, 60))}</span></div>`;
  }).join('') + '<div class="more"></div>';
}

/* ---------- 工单 ---------- */
const CATS = ['充值问题', '智能体配置', '发票申请', '故障反馈', '产品咨询', '账号问题', '其他'];

async function loadTickets() {
  const box = f('tk-list');
  const j = await api('/api/support/tickets');
  if (j.code !== 0) { box.innerHTML = '<div class="empty">加载失败</div>'; return; }
  const list = j.data || [];
  f('tk-count').textContent = list.length;
  if (!list.length) {
    box.innerHTML = `<div class="empty">还没有工单。遇到问题可以点右上角「＋ 提交工单」，或直接<a href="/zt/chat" style="color:var(--accent)">进入在线会话</a>。</div>`;
    return;
  }
  box.innerHTML = list.map(t => `
    <div class="tk-item">
      <div class="r1">
        <b>${esc(t.title)}</b>
        <span class="badge">${esc(t.category || '其他')}</span>
        <span class="badge ${t.status === '处理中' ? 'warn' : 'green'}">${esc(t.status)}</span>
        <span class="tm">${fmtTime(t.created_at)}</span>
      </div>
      <div class="r2">${esc(t.content)}</div>
      ${t.reply ? `<div class="reply"><b>客服回复：</b>${esc(t.reply)}</div>` : ''}
    </div>`).join('');
}

function openTicketModal() {
  openModal(`
    <h3>提交工单</h3>
    <div class="field">
      <label>问题标题<em>*</em></label>
      <input id="tk-title" placeholder="一句话描述问题，例如：充值后点数未到账" maxlength="60" />
    </div>
    <div class="form-row">
      <div class="field">
        <label>问题分类</label>
        <select id="tk-cat">${CATS.map(c => `<option>${c}</option>`).join('')}</select>
      </div>
      <div class="field">
        <label>紧急程度</label>
        <select id="tk-pri"><option>普通</option><option>高</option><option>紧急</option></select>
      </div>
    </div>
    <div class="field">
      <label>问题描述<em>*</em></label>
      <textarea id="tk-content" placeholder="请详细描述遇到的问题、出现时间、涉及的单号或截图说明…" maxlength="1000" style="min-height:120px"></textarea>
    </div>
    <div class="hint">提交后客服会在 1 个工作日内跟进，处理结果可在「我的工单」查看。</div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" id="tk-submit" onclick="submitTicket()">提交工单</button>
    </div>
  `, true);
  setTimeout(() => f('tk-title') && f('tk-title').focus(), 60);
}

async function submitTicket() {
  const title = f('tk-title').value.trim();
  const content = f('tk-content').value.trim();
  if (!title) return toast('请填写问题标题');
  if (!content) return toast('请填写问题描述');
  const btn = f('tk-submit');
  btn.disabled = true; btn.textContent = '提交中…';
  const j = await api('/api/support/tickets', 'POST', {
    title, content, category: f('tk-cat').value, priority: f('tk-pri').value,
  });
  btn.disabled = false; btn.textContent = '提交工单';
  if (j.code === 0) {
    closeModal();
    toast(j.msg || '工单已提交');
    loadTickets();
  } else {
    toast(j.msg || '提交失败');
  }
}

/* ---------- 页内最新公告（弹窗由公共脚本全局处理） ---------- */
(async () => {
  try {
    const j = await api('/api/announcements');
    if (j.code !== 0 || !j.data || !j.data.length) return;
    const box = document.getElementById('ann-box');
    box.style.display = '';
    box.innerHTML = j.data.slice(0, 3).map(a => `
      <div style="display:flex;gap:12px;align-items:flex-start;padding:13px 16px;margin-bottom:8px;
        border:1px solid ${a.level === '重要' ? 'rgba(192,57,43,.3)' : 'var(--border)'};
        background:${a.level === '重要' ? 'var(--accent-soft)' : 'var(--bg-soft)'};border-radius:12px">
        <span class="badge ${a.level === '重要' ? 'red' : ''}" style="flex:0 0 auto">${a.level === '重要' ? '重要' : '公告'}</span>
        <div style="min-width:0">
          <b style="font-size:13.5px">${esc(a.title)}</b>
          <div class="small muted" style="margin-top:3px;white-space:pre-wrap">${esc(a.content)}</div>
          <div class="mono" style="font-size:11px;color:var(--muted-2);margin-top:5px">${fmtTime(a.published_at)}</div>
        </div>
      </div>`).join('');
  } catch (e) { }
})();
</script>
</body>
</html>
