<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>充值档位 - 泰卦智能管理后台</title>
<link rel="icon" href="../icons/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="../icons/favicon-32.png" />
<link rel="stylesheet" href="common.css" />
<link rel="stylesheet" href="common-admin.css" />
<style>
.tier-row{display:grid;grid-template-columns:44px 1fr 1fr 150px 38px;gap:10px;align-items:center;margin-bottom:10px}
.tier-row .idx{font-size:12.5px;color:var(--muted);text-align:center}
.tier-row input{width:100%}
.tier-row .rate{font-size:12px;color:var(--muted);white-space:nowrap}
.tier-row .rate b{color:var(--accent);font-weight:600}
.tier-row .del{border:1px solid var(--border-strong);background:var(--bg);border-radius:8px;cursor:pointer;color:var(--muted);height:38px}
.tier-row .del:hover{color:#c0392b;border-color:#c0392b}
.tier-head{display:grid;grid-template-columns:44px 1fr 1fr 150px 38px;gap:10px;margin-bottom:6px}
.tier-head span{font-size:11.5px;color:var(--muted);font-weight:600}
.tier-head .c{text-align:center}
.badge-custom{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;background:rgba(46,124,110,.12);color:var(--accent);font-weight:600}
.badge-default{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;background:var(--bg-soft);color:var(--muted);font-weight:600}
.preview{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
.preview .pcard{width:150px;border:1px solid var(--border);border-radius:12px;padding:14px 12px;text-align:center;background:var(--bg)}
.preview .pcard .pt{font-size:17px;font-weight:700}
.preview .pcard .pp{font-size:12px;color:var(--muted);margin-top:3px}
.preview .pcard .py{font-size:12px;margin-top:6px}
.preview .pcard .py b{font-size:14px}
</style>
</head>
<body>
<div class="adm">
  <div id="adm-side-root"></div>
  <div class="adm-main">
    <div id="adm-top-root"></div>
    <div class="adm-body">

      <div class="adm-head">
        <div>
          <h1>充值档位</h1>
          <p>商家端「TOKEN 充值」页的选择充值档位；保存后立即生效</p>
        </div>
        <div class="right">
          <button class="btn btn-sm" onclick="load()">刷新</button>
          <button class="btn btn-primary btn-sm" onclick="save()">保存档位</button>
        </div>
      </div>

      <div class="panel" style="margin-bottom:16px">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <b>档位设置</b>
          <span id="mode-badge" class="badge-default">加载中…</span>
          <span style="flex:1"></span>
          <button class="btn btn-sm" onclick="addRow()">＋ 添加档位</button>
          <button class="btn btn-sm" onclick="resetDefault()">恢复内置默认</button>
        </div>
        <div class="hint" style="margin-top:8px;line-height:1.7">
          金额（元）与点数均须大于 0，金额不能重复，最多 20 档，顺序即商家端展示顺序（建议从小到大排列）。<br />
          删除全部档位并保存 = 恢复内置默认 6 档（10元/1000点、30元/3200点、50元/5500点、100元/11500点、300元/36000点、500元/62000点）。
        </div>
        <div class="tier-head" style="margin-top:16px">
          <span class="c">#</span><span>金额（元）</span><span>点数</span><span>赠送比 / 单价</span><span></span>
        </div>
        <div id="tier-rows"></div>
      </div>

      <div class="panel">
        <div class="panel-h"><b>商家端预览</b><span class="sub">以下为商家「TOKEN 充值」页当前看到的效果</span></div>
        <div id="preview" class="preview"></div>
      </div>

    </div>
  </div>
</div>

<script src="common-admin.js"></script>
<script>
const $ = id => document.getElementById(id);
let ROWS = [];   // [{price, points}]
let CUSTOM = false;

(async () => {
  const me = await admInit('admin-tiers.html');
  if (!me) return;
  await load();
})();

async function load() {
  const j = await api('/api/admin/recharge-tiers');
  if (j.code !== 0) return toast(j.msg || '加载失败');
  ROWS = (j.data.tiers || []).map(t => ({ price: t.price, points: t.points }));
  CUSTOM = !!j.data.custom;
  render();
}

function render() {
  const badge = $('mode-badge');
  badge.className = CUSTOM ? 'badge-custom' : 'badge-default';
  badge.textContent = CUSTOM ? '自定义档位' : '内置默认档位';

  const box = $('tier-rows');
  box.innerHTML = ROWS.map((t, i) => {
    const rate = t.price > 0 ? (t.points / t.price) : 0;
    return `
    <div class="tier-row" data-i="${i}">
      <span class="idx">${i + 1}</span>
      <input type="number" min="1" step="1" placeholder="金额（元）" value="${t.price}" oninput="onEdit(${i}, 'price', this.value)" />
      <input type="number" min="1" step="1" placeholder="点数" value="${t.points}" oninput="onEdit(${i}, 'points', this.value)" />
      <span class="rate">${rate ? `1元 ≈ <b>${Math.round(rate * 10) / 10}</b> 点` : ''}</span>
      <button type="button" class="del" title="删除该档位" onclick="delRow(${i})">✕</button>
    </div>`;
  }).join('') || '<div class="hint" style="padding:6px 0">暂无档位，点击「添加档位」或「恢复内置默认」</div>';
  renderPreview();
}

function onEdit(i, key, val) {
  ROWS[i][key] = parseInt(val, 10) || 0;
  // 就地更新该行的赠送比，不打断输入焦点
  const row = document.querySelector('.tier-row[data-i="' + i + '"]');
  if (row) {
    const t = ROWS[i];
    row.querySelector('.rate').innerHTML =
      t.price > 0 && t.points > 0 ? `1元 ≈ <b>${Math.round(t.points / t.price * 10) / 10}</b> 点` : '';
  }
  renderPreview();
}

function addRow(price, points) {
  ROWS.push({ price: price || '', points: points || '' });
  render();
  const rows = $('tier-rows').querySelectorAll('.tier-row');
  if (rows.length) rows[rows.length - 1].querySelector('input').focus();
}

function delRow(i) {
  ROWS.splice(i, 1);
  render();
}

function resetDefault() {
  ROWS = [];
  save(true);
}

function renderPreview() {
  const box = $('preview');
  const list = ROWS.filter(t => t.price > 0 && t.points > 0);
  if (!list.length) {
    box.innerHTML = '<span class="small muted">档位为空时商家端展示内置默认 6 档</span>';
    return;
  }
  box.innerHTML = list.map(t => `
    <div class="pcard">
      <div class="pt">${t.points} 点</div>
      <div class="pp">约 ${Math.round(t.points / Math.max(t.price, 1) * 10) / 10} 点/元</div>
      <div class="py">￥<b>${t.price}</b></div>
    </div>`).join('');
}

function collect() {
  const out = [];
  for (let i = 0; i < ROWS.length; i++) {
    const t = ROWS[i];
    if (!t.price || !t.points) {
      toast(`第 ${i + 1} 行金额与点数必须填写且大于 0`);
      return null;
    }
    out.push({ price: t.price, points: t.points });
  }
  for (let i = 0; i < out.length; i++) {
    for (let k = i + 1; k < out.length; k++) {
      if (out[i].price === out[k].price) {
        toast(`第 ${i + 1} 行与第 ${k + 1} 行金额重复（${out[i].price} 元）`);
        return null;
      }
    }
  }
  return out;
}

async function save(silent) {
  const tiers = collect();
  if (tiers === null) return;
  const btns = document.querySelectorAll('.adm-head button');
  btns.forEach(b => b.disabled = true);
  const j = await api('/api/admin/recharge-tiers', 'PUT', { tiers });
  btns.forEach(b => b.disabled = false);
  if (j.code === 0) {
    toast(j.msg || '已保存');
    ROWS = (j.data.tiers || []).map(t => ({ price: t.price, points: t.points }));
    CUSTOM = !!j.data.custom;
    render();
  } else {
    toast(j.msg || '保存失败');
  }
}
</script>
</body>
</html>
