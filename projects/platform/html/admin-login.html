<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex,nofollow" />
<title>管理后台登录 - 泰卦智能</title>
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="/icons/favicon-32.png" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --border:#e4e4e7;--border-strong:#d4d4d8;--text:#18181b;--text-2:#3f3f46;
  --muted:#71717a;--muted-2:#a1a1aa;--accent:#c0392b;
  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;line-height:1.6;background:#fff;color:var(--text);
}
.login-wrap{display:flex;min-height:100vh}

/* ① 左侧品牌区 */
.brand-side{
  flex:0 0 58%;background:#101012;color:#fafafa;position:relative;overflow:hidden;
  display:flex;flex-direction:column;justify-content:center;padding:0 7vw;
}
.brand-side::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(620px 360px at 32% 42%,rgba(192,57,43,.20),transparent 72%),
  linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:auto,64px 64px,64px 64px;
  mask-image:radial-gradient(760px 520px at 32% 45%,#000 30%,transparent 80%);
  -webkit-mask-image:radial-gradient(760px 520px at 32% 45%,#000 30%,transparent 80%);
}
.brand-side .badge{
  position:relative;display:inline-flex;align-items:center;gap:7px;align-self:flex-start;
  padding:5px 13px;border:1px solid rgba(255,255,255,.18);border-radius:999px;
  font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;color:rgba(255,255,255,.72);margin-bottom:30px;
}
.brand-side .badge i{width:6px;height:6px;border-radius:50%;background:#e05a4b;display:block}
.brand-side h1{font-size:clamp(28px,3.2vw,46px);font-weight:700;line-height:1.3;position:relative}
.brand-side h1 .hl{color:#e05a4b}
.brand-side .sub{margin-top:24px;color:rgba(255,255,255,.55);font-size:14.5px;max-width:440px;line-height:1.85;position:relative}
.brand-side .foot{
  position:absolute;bottom:32px;left:7vw;right:7vw;display:flex;justify-content:space-between;
  font-family:var(--mono);font-size:11.5px;color:rgba(255,255,255,.3);
}
@media(max-width:880px){.brand-side{display:none}.login-side{flex:1}}

/* ② 右侧登录卡 */
.login-side{flex:1;display:flex;align-items:center;justify-content:center;background:#fff;padding:34px}
.login-card{width:100%;max-width:372px}
.login-card h2{font-size:23px;font-weight:700}
.login-card .desc{color:var(--muted);font-size:13.5px;margin:8px 0 28px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:var(--text-2);margin-bottom:6px;font-weight:500}
.field .wrap{position:relative}
.field input{
  width:100%;padding:11px 44px 11px 13px;border:1px solid var(--border-strong);border-radius:10px;
  font-size:14.5px;background:#fff;color:var(--text);font-family:inherit;transition:border-color .2s;
}
.field input:focus{outline:none;border-color:var(--accent)}
.field .eye{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;
  display:grid;place-items:center;background:none;border:none;cursor:pointer;color:var(--muted-2);
}
.field .eye:hover{color:var(--text-2)}
.err{display:none;background:rgba(192,57,43,.08);border:1px solid rgba(192,57,43,.3);color:var(--accent);border-radius:10px;padding:9px 13px;font-size:13px;margin-bottom:14px}
.btn-login{
  width:100%;padding:13px;border:none;border-radius:11px;background:var(--accent);color:#fff;
  font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .2s;letter-spacing:.2em;
}
.btn-login:hover{opacity:.88}
.btn-login:disabled{opacity:.45;cursor:not-allowed}
.sec-note{
  margin-top:22px;border:1px solid var(--border);border-radius:12px;padding:12px 14px;
  font-size:12px;color:var(--muted);line-height:1.8;background:#fafafa;
}
.sec-note b{color:var(--text-2)}
.page-foot{margin-top:20px;font-size:11.5px;color:var(--muted-2);display:flex;justify-content:space-between;font-family:var(--mono)}
#toast{position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-80px);z-index:999;background:#18181b;color:#fff;padding:10px 22px;border-radius:999px;font-size:14px;transition:transform .3s ease}
#toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="login-wrap">

  <!-- ① 品牌区 -->
  <div class="brand-side">
    <span class="badge"><i></i>ADMIN CONSOLE</span>
    <h1>泰卦智能<br/><span class="hl">平台管理后台</span></h1>
    <p class="sub">商家审核、智能体与标签配置、点数与兑换码、客服团队与工单、AI 知识库、系统设置 —— 平台侧全部管理能力集中于此。</p>
    <div class="foot"><span>taikua.cn</span><span>INTERNAL USE ONLY</span></div>
  </div>

  <!-- ② 登录卡 -->
  <div class="login-side">
    <form class="login-card" id="form" autocomplete="off">
      <h2>管理员登录</h2>
      <p class="desc">本入口仅供平台管理员使用，需管理员工号 + 密码</p>

      <div class="err" id="err"></div>

      <div class="field">
        <label>管理员工号</label>
        <input id="phone" type="text" maxlength="10" placeholder="如 ADM001" required autocomplete="username"
               style="font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em" />
      </div>

      <div class="field">
        <label>登录密码</label>
        <div class="wrap">
          <input id="password" type="password" placeholder="登录密码" autocomplete="current-password" />
          <button type="button" class="eye" id="eye" title="显示密码">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/></svg>
          </button>
        </div>
      </div>

      <button class="btn-login" type="submit" id="btn-login">登　录</button>

      <div class="sec-note">
        <b>安全提示</b>：本入口仅支持「工号 + 密码」登录，不提供验证码，也不与商家端账号互通。登录行为将写入操作日志，请勿在公共设备上保存凭据。
      </div>

      <div class="page-foot"><span>TAIKUA ADMIN</span><span id="y"></span></div>
    </form>
  </div>
</div>

<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const ADMIN_HOME = '/ht/admin';
document.getElementById('y').textContent = 'v1.0 · ' + new Date().getFullYear();

function showErr(msg) { const e = $('#err'); e.textContent = msg; e.style.display = 'block'; }
function showToast(msg) {
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2600);
}

/* 密码明暗切换 */
$('#eye').onclick = () => {
  const inp = $('#password');
  const on = inp.type === 'password';
  inp.type = on ? 'text' : 'password';
  $('#eye').style.color = on ? 'var(--accent)' : '';
  $('#eye').title = on ? '隐藏密码' : '显示密码';
};

/* 登录 */
$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  const phone = $('#phone').value.trim().toUpperCase();
  const password = $('#password').value;
  if (!/^ADM\d{1,6}$/.test(phone)) return showErr('请输入正确的管理员工号（如 ADM001）');
  if (!password) return showErr('请输入登录密码');
  $('#err').style.display = 'none';
  const btn = $('#btn-login');
  btn.disabled = true; btn.textContent = '登录中…';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone, password, scope: 'admin' })
    });
    const j = await res.json();
    if (j.code === 0) {
      localStorage.setItem('tk_token', j.data.token);
      showToast('验证通过，正在进入管理后台…');
      setTimeout(() => location.href = ADMIN_HOME, 500);
    } else {
      showErr(j.msg || '登录失败');
    }
  } catch (err) {
    showErr('网络异常，请确认后端服务已启动');
  }
  btn.disabled = false; btn.textContent = '登　录';
});

/* 已有管理员登录态：直接进入后台（商家 token 一律清除，不允许在此混用） */
(function () {
  const tk = localStorage.getItem('tk_token');
  if (!tk) return;
  fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + tk } })
    .then(r => r.json())
    .then(j => {
      if (j.code === 0 && j.data && j.data.role === 'admin') {
        location.href = ADMIN_HOME;
      } else {
        localStorage.removeItem('tk_token');   // 商家账号的登录态在此无效
      }
    })
    .catch(() => { });
})();
</script>
</body>
</html>
