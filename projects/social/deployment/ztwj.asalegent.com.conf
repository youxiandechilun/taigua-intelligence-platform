# 泰卦部署改造：本次只接管 ztwj.asalegent.com，其他站点沿用原配置。
server {
    listen 80;
    server_name ztwj.asalegent.com;
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/ztwj.asalegent.com;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ztwj.asalegent.com;
    ssl_certificate /www/server/panel/vhost/cert/ztwj.asalegent.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/ztwj.asalegent.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TAIGUA_PUBLISH_TLS:10m;
    ssl_session_timeout 10m;
    client_max_body_size 512m;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/ztwj.asalegent.com;
        try_files $uri =404;
    }
    location ~ (^|/)\. { return 404; }

    # SSE 扫码、任务进度和视频范围请求都由同一个认证网关转发。
    location / {
        proxy_pass http://127.0.0.1:18870;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    access_log /www/wwwlogs/ztwj.asalegent.com.log;
    error_log /www/wwwlogs/ztwj.asalegent.com.error.log;
}
